name: Build AERO Icon Atlas

on:
  workflow_dispatch:
  push:
    paths:
      - 'site/**'
      - 'scripts/build-pages-data.mjs'
      - 'scripts/lib/**'
      - 'catalog/taxonomy.json'
      - 'manifest*.jsonl'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

concurrency:
  group: icon-atlas-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frontend JavaScript
        run: |
          node --check site/app.js
          node --check site/service-worker.js
          node --check site/register-sw.js

      - name: Guard removed legacy brand references
        run: |
          if grep -Rin --exclude-dir=.git --exclude='*.svg' -E 'icons8' README.md AGENTS.md catalog docs scripts site .github 2>/dev/null; then
            echo "Forbidden legacy brand reference found."
            exit 1
          fi

      - name: Build static catalog, search shards and sprites
        env:
          SPRITE_CONCURRENCY: '64'
        run: node scripts/build-pages-data.mjs .pages-dist

      - name: Check published size
        run: |
          bytes=$(du -sb .pages-dist | cut -f1)
          echo "Published site bytes: $bytes"
          max=$((950 * 1024 * 1024))
          if [ "$bytes" -gt "$max" ]; then
            echo "Site is above the 950 MiB safety threshold. Reduce preview data before publishing."
            exit 1
          fi

      - name: Publish static site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.pages-dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Publish AERO Icon Atlas"
