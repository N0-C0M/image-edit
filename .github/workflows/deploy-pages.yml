name: Deploy AERO Icon Atlas

on:
  workflow_dispatch:
  push:
    paths:
      - 'site/**'
      - 'scripts/build-pages-data.mjs'
      - 'scripts/lib/**'
      - 'catalog/taxonomy.json'
      - 'manifest*.jsonl'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build static catalog, search shards and sprites
        env:
          SPRITE_CONCURRENCY: '64'
        run: node scripts/build-pages-data.mjs .pages-dist

      - name: Check Pages size
        run: |
          bytes=$(du -sb .pages-dist | cut -f1)
          echo "Published site bytes: $bytes"
          max=$((950 * 1024 * 1024))
          if [ "$bytes" -gt "$max" ]; then
            echo "Site is above the 950 MiB safety threshold. Reduce preview data before deployment."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
