name: Build 100k open-source icons

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-icon-library.mjs'
      - '.github/workflows/build-100k-icons.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Iconify utilities
        run: npm install --no-save @iconify/utils

      - name: Download current Iconify icon sets
        run: |
          rm -rf .cache/iconify
          git clone --depth 1 https://github.com/iconify/icon-sets.git .cache/iconify

      - name: Export exactly 100000 SVG icons
        env:
          MAX_PER_COLLECTION: '5000'
        run: node scripts/build-icon-library.mjs .cache/iconify 100000

      - name: Validate icon count
        run: |
          count=$(find library -type f -name '*.svg' | wc -l)
          echo "SVG count: $count"
          test "$count" -eq 100000

      - name: Commit generated library
        run: |
          rm -rf node_modules package-lock.json .cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library manifest.jsonl collections-selected.json ICON_LIBRARY_STATS.md THIRD_PARTY_LICENSES.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build 100000 open-source SVG icons"
          git push
