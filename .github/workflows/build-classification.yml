name: Build icon classification indexes

on:
  workflow_dispatch:
  push:
    paths:
      - 'manifest*.jsonl'
      - 'catalog/taxonomy.json'
      - 'scripts/build-classification.mjs'
      - 'scripts/sanitize-catalog-metadata.mjs'
      - 'scripts/lib/**'
      - '.github/workflows/build-classification.yml'

permissions:
  contents: write

concurrency:
  group: icon-classification
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build taxonomy, map and statistics
        run: node scripts/build-classification.mjs

      - name: Sanitize public catalog metadata
        run: node scripts/sanitize-catalog-metadata.mjs

      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            catalog/packs.json \
            catalog/categories.json \
            catalog/styles.json \
            catalog/classification-stats.json \
            catalog/icon-map.json \
            ICON_MAP.md \
            ICON_LIBRARY_STATS.md
          if git diff --cached --quiet; then
            echo "Classification unchanged"
            exit 0
          fi
          git commit -m "Rebuild icon taxonomy, map and statistics"
          git pull --rebase --autostash
          git push
